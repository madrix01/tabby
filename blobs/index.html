<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bean Buddies</title>
<style>
  :root { --ink:#2b2420; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
         color:var(--ink); font:16px/1.4 system-ui,sans-serif; background:#d9d9dd; }
  h1 { margin:0; font:700 1.5rem Georgia,serif; letter-spacing:.12em; text-transform:uppercase; }
  #stage { width:min(96vw,980px); }
  svg { width:100%; height:auto; overflow:visible; display:block; }
  .pet { cursor:pointer; }
  .label { font:700 11px Georgia,serif; letter-spacing:.1em; text-anchor:middle; fill:var(--ink); }

  /* palettes: base + dark (limbs, outline) + light (highlight) */
  .c-orange { --base:#f6a93b; --dark:#d9871c; --light:#fcd18a; --acc:#2447d6; }
  .c-brown  { --base:#c9714e; --dark:#a1502f; --light:#e09a7c; --acc:#ff6a2e; }
  .c-blue   { --base:#2fa6e6; --dark:#1b82bd; --light:#7cc9f2; --acc:#ff5a2a; }
  .c-green  { --base:#7cc23c; --dark:#59982a; --light:#b0de7a; --acc:#ff5a2a; }
  .c-teal   { --base:#16b79d; --dark:#0c8f7a; --light:#62d6c1; --acc:#ff6a3d; }
  .c-pink   { --base:#f2679b; --dark:#d2467d; --light:#f8a1c1; --acc:#2447d6; }
  .c-purple { --base:#8c6fd6; --dark:#6c52b4; --light:#b8a4ee; --acc:#ff7a3a; }
  .c-gray   { --base:#4b4140; --dark:#2f2827; --light:#6f6462; --acc:#ff5a2a; }
  .fill  { fill:var(--base); }
  .dark  { fill:var(--dark); }
  .acc   { fill:var(--acc); }
  .light { fill:var(--light); }

  /* all body motion (walk cycle, squash, arms, legs) is driven by the rig in JS; CSS only does small face/prop loops */
  .eye { transform-box:fill-box; transform-origin:50% 50%; transition:transform .08s; }
  .blink .eye { transform:scaleY(.1); }
  .balloon { transform-origin:0 0; animation:sway 3s ease-in-out infinite; }
  .m-smile, .m-open, .m-o { display:none; }
  .likes .m-smile, .hates .m-o { display:inline; }
  .likes.happy .m-smile { display:none; } .likes.happy .m-open { display:inline; }
  @keyframes sway { 50% { transform:rotate(7deg); } }

  /* evolution: flash white silhouette (Pokemon style), then pop into the new form */
  .pet.evolving .grow { animation:evoFlash .32s steps(1) infinite; }
  .pw { transform-box:fill-box; transform-origin:50% 100%; }
  .pet.pop .pw { animation:pop .9s cubic-bezier(.3,1.7,.5,1) 1; }
  .spark { font-size:18px; fill:#ffd23f; pointer-events:none; animation:spark 1.2s ease-out forwards; }
  .burst { fill:#fff; pointer-events:none; transform-box:fill-box; transform-origin:50% 50%; animation:burst 1s ease-out forwards; }
  .sel-mark { fill:#2b2420; opacity:.75; }
  .heart { font-size:20px; fill:#e0457b; pointer-events:none; animation:up 1s ease-out forwards; }
  .lvl { font:700 14px Georgia,serif; fill:#c2410c; pointer-events:none; text-anchor:middle; animation:up 1.4s ease-out forwards; }
  @keyframes evoFlash { 0% { filter:none; } 50% { filter:brightness(0) invert(1) drop-shadow(0 0 10px #fff); } }
  @keyframes pop   { 0% { transform:scale(.2,.2); } 60% { transform:scale(1.15,1.15); } 100% { transform:scale(1,1); } }
  @keyframes spark { from { transform:translate(0,0) scale(.3); opacity:1; } to { transform:translate(var(--dx),var(--dy)) scale(1.2); opacity:0; } }
  @keyframes burst { from { transform:scale(.2); opacity:.95; } to { transform:scale(9); opacity:0; } }
  @keyframes up { to { transform:translateY(-60px); opacity:0; } }

  progress { width:200px; height:10px; accent-color:#c2410c; }
  #xpinfo { min-width:100%; text-align:center; font-size:14px; }
  #ui { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:700px; padding:0 12px; align-items:center; }
  select, button { font:inherit; padding:6px 10px; border-radius:10px; border:2px solid var(--ink); background:#fbf3df; color:var(--ink); cursor:pointer; }
  button:hover { background:#fff0b0; }
  #name { font-weight:700; min-width:100%; text-align:center; font-family:Georgia,serif; letter-spacing:.08em; text-transform:uppercase; }
</style>
</head>
<body>
  <h1>Bean Buddies</h1>
  <div id="stage"><svg id="svg" viewBox="-30 -60 700 380"></svg></div>
  <div id="ui">
    <div id="name"></div>
    <div id="xpinfo"></div><div style="min-width:100%;text-align:center"><progress id="xp" max="1" value="0"></progress></div>
    <select id="color"></select>
    <select id="hat"></select>
    <select id="glasses"></select>
    <select id="toy"></select>
    <select id="gait"></select>
    <button id="roll">Reroll this one</button>
    <button id="rollAll">Reroll all</button>
    <span style="min-width:100%"></span>
    <button id="dance">Dance</button>
    <button id="run">Walk</button>
    <button id="danceAll">Dance party</button>
    <button id="runAll">Parade</button>
    <button id="stop">Stop all</button>
    <button id="feed">Feed 🍎</button>
    <button id="evolve">Evolve ⚡</button>
  </div>
<script src="growth.js"></script>
<script>
// ---------- shape helpers (local coords: origin = bottom centre of the body, up is negative) ----------
const sc = (d, kx, ky = kx) => { let ax = 0; return d.replace(/[MCLZ]|-?\d*\.?\d+/g, t => /[A-Z]/.test(t) ? (ax = 0, t) : (+t * (ax++ % 2 ? ky : kx)).toFixed(1)); };
function cloud(cx, cy, rx, ry, n){
  const P = k => { const a = k/n*Math.PI*2; return [cx+rx*Math.cos(a), cy+ry*Math.sin(a)]; };
  let d = 'M'+P(0).map(v=>v.toFixed(1)).join(' ');
  for (let k=0;k<n;k++){ const a=P(k), b=P(k+1), r=Math.hypot(b[0]-a[0], b[1]-a[1])*.62; d += ` A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${b[0].toFixed(1)} ${b[1].toFixed(1)}`; }
  return d+'Z';
}
// spiky sun: n spikes (even), outer radius R, inner r, slightly irregular
function star(n, R, r, seed=1){
  const cy = -R*.95; let d = '';
  for (let k=0;k<2*n;k++){ const a = Math.PI*k/n - Math.PI/2, rad = (k%2 ? r : R)*(1 + .07*Math.sin(k*2.3+seed)); d += `${k?'L':'M'}${(rad*Math.cos(a)).toFixed(1)} ${(cy+rad*Math.sin(a)).toFixed(1)}`; }
  return { d:d+'Z', w:R*.78, hat:cy-R*.9, eyes:cy-R*.08, arm:cy+R*.05 };
}
const egg  = (w,h) => ({ d:`M0 0 C${-w} 0 ${-w*1.1} ${-h*.5} ${-w*.78} ${-h*.82} C${-w*.45} ${-h*1.08} ${w*.45} ${-h*1.08} ${w*.78} ${-h*.82} C${w*1.1} ${-h*.5} ${w} 0 0 0Z`, w, hat:-h*.92, eyes:-h*.62, arm:-h*.4 });
const pill = (w,h) => ({ d:`M${-w} ${-h+w} A${w} ${w} 0 0 1 ${w} ${-h+w} V${-w} A${w} ${w} 0 0 1 ${-w} ${-w}Z`, w, hat:-h, eyes:-h*.76, arm:-h*.55 });
const GOURD = { d:'M-26 -100 C-26 -135 -20 -150 0 -150 C20 -150 26 -135 26 -100 C26 -85 40 -75 40 -45 C40 -15 20 0 0 0 C-20 0 -40 -15 -40 -45 C-40 -75 -26 -85 -26 -100Z', w:38, hat:-148, eyes:-122, arm:-66 };
const big = (b,kx,ky=kx) => ({ d:sc(b.d,kx,ky), w:b.w*kx, hat:b.hat*ky, eyes:b.eyes*ky, arm:b.arm*ky });

// silhouette half-width at height y, measured from the real path so arms/legs always start inside the body edge
const probe = document.createElementNS('http://www.w3.org/2000/svg','svg'); probe.setAttribute('style','position:absolute;width:0;height:0;visibility:hidden');
const probePath = document.createElementNS('http://www.w3.org/2000/svg','path'); probe.append(probePath); document.body.append(probe);
const profiles = {};
function edgeX(d, y){
  if (!profiles[d]) { probePath.setAttribute('d', d); const L = probePath.getTotalLength(); profiles[d] = Array.from({length:361}, (_,k) => probePath.getPointAtLength(L*k/360)); }
  const pts = profiles[d]; let m = 0;
  for (let k=0;k<pts.length-1;k++){ const a=pts[k], b=pts[k+1]; if ((a.y-y)*(b.y-y)<=0 && a.y!==b.y) m = Math.max(m, Math.abs(a.x+(b.x-a.x)*(y-a.y)/(b.y-a.y))); }
  return m;
}

// hand-drawn wobble: resample a path every ~5 units, push each point along its normal by smooth low + high frequency noise, re-smooth.
// deterministic per seed, so shapes don't change between renders.
function hand(d, amp, seed = 1){
  probePath.setAttribute('d', d);
  const Ltot = probePath.getTotalLength(), n = Math.max(24, Math.round(Ltot/5)), pts = [];
  for (let k=0;k<n;k++){
    const s = Ltot*k/n, p = probePath.getPointAtLength(s), a = probePath.getPointAtLength(Math.max(0, s-1.5)), b = probePath.getPointAtLength(Math.min(Ltot, s+1.5));
    let tx = b.x-a.x, ty = b.y-a.y; const tl = Math.hypot(tx,ty) || 1; tx/=tl; ty/=tl;
    const u = k/n*Math.PI*2, off = amp*(.55*Math.sin(u*2+seed) + .35*Math.sin(u*5+seed*2.1) + .2*Math.sin(u*11+seed*3.7)) + amp*.18*Math.sin(s*.45+seed*5);
    pts.push([p.x + ty*off, p.y - tx*off]);
  }
  const mid = (a,b) => [(a[0]+b[0])/2, (a[1]+b[1])/2], f = v => v.map(x=>x.toFixed(1)).join(' ');
  let out = 'M' + f(mid(pts[n-1], pts[0]));
  for (let k=0;k<n;k++) out += ` Q${f(pts[k])} ${f(mid(pts[k], pts[(k+1)%n]))}`;
  return out + 'Z';
}
const ell = (cx, cy, rx, ry) => { const k = .5523; return `M${cx-rx} ${cy} C${cx-rx} ${cy-ry*k} ${cx-rx*k} ${cy-ry} ${cx} ${cy-ry} C${cx+rx*k} ${cy-ry} ${cx+rx} ${cy-ry*k} ${cx+rx} ${cy} C${cx+rx} ${cy+ry*k} ${cx+rx*k} ${cy+ry} ${cx} ${cy+ry} C${cx-rx*k} ${cy+ry} ${cx-rx} ${cy+ry*k} ${cx-rx} ${cy}Z`; };
const hash = str => [...str].reduce((h,c) => (h*31 + c.charCodeAt(0)) % 997, 7) / 40;
// every form gets its own slightly wobbly outline (used for fill, clip and limb attachment)
function inked(f){
  if (!f.dh) { const seed = hash(f.name), amp = Math.max(1.2, Math.min(2.8, f.w*.05)); f.dh = hand(f.d, amp, seed); }   /* slightly imperfect, still clean */
  return f;
}

// art layers are functions of the form so they follow its size (back = behind body, over = on the body, face = on the face)
const OUT = "";
const H_ = f => Math.abs(f.hat);
const floppy = f => [-1,1].map(s => `<path class="fill" ${OUT} d="${hand(ell(s*f.w*.95, f.hat+H_(f)*.42, f.w*.2, H_(f)*.26), 1.3, s+2)}" transform="rotate(${s*8} ${s*f.w*.95} ${f.hat+H_(f)*.42})"/>`).join('');
const bunnyEars = f => [-1,1].map(s => `<g transform="rotate(${s*8} ${s*f.w*.4} ${f.hat})"><path class="fill" ${OUT} d="${hand(ell(s*f.w*.4, f.hat-H_(f)*.18, f.w*.17, H_(f)*.3), 1.4, s+5)}"/><ellipse cx="${s*f.w*.4}" cy="${f.hat-H_(f)*.16}" rx="${f.w*.08}" ry="${H_(f)*.2}" fill="#ff9fb8" opacity=".6"/></g>`).join('');
const whiskers = f => { const y = f.eyes + 12; return [-1,1].map(s => `<path d="M${s*(f.eyeX+8)} ${y-2} L${s*(f.eyeX+24)} ${y-6} M${s*(f.eyeX+8)} ${y+1} L${s*(f.eyeX+26)} ${y+1} M${s*(f.eyeX+8)} ${y+4} L${s*(f.eyeX+24)} ${y+8}" stroke="var(--dark)" stroke-width="1.4" fill="none" stroke-linecap="round"/>`).join(''); };
const tufts = f => `<path d="M-6 ${f.hat+6} q-2 -14 -12 -20 M0 ${f.hat+4} q0 -18 -2 -26 M6 ${f.hat+6} q4 -14 14 -18" stroke="var(--dark)" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
const belly = f => `<ellipse cx="0" cy="${f.eyes*.4}" rx="${f.w*.55}" ry="${f.w*.7}" fill="#fff" opacity=".18"/>`;
const freckles = f => [[-.4,.5],[.3,.35],[.05,.7],[.45,.6]].map(([x,y]) => `<circle cx="${f.w*x}" cy="${f.arm*y}" r="2.6" fill="#000" opacity=".18"/>`).join('');
const cheeks = f => `<ellipse cx="${-f.eyeX*1.9}" cy="${f.eyes+9}" rx="6" ry="3.5" fill="#ff7fa5" opacity=".5"/><ellipse cx="${f.eyeX*1.9}" cy="${f.eyes+9}" rx="6" ry="3.5" fill="#ff7fa5" opacity=".5"/>`;
// held balloon: origin = the hand
const balloon = color => () => `<g class="balloon"><path d="M0 0 Q5 -34 9 -64" stroke="#6b5b4b" stroke-width="1.3" fill="none"/>
  <ellipse cx="9" cy="-84" rx="16" ry="20" fill="${color}"/><ellipse cx="3" cy="-91" rx="4" ry="7" fill="#fff" opacity=".45"/><path d="M6 -64 l3 5 l3 -5Z" fill="${color}"/></g>`;

// ---------- species = chain of forms (Growth.formAt picks the form from level) ----------
const T = { eyeSize:1.25, eyeX:8, legLen:.75, limbW:3 };   // "baby" face
const CHARS = [
  { name:'Spiky', color:'blue', gait:'stomp', forms:[
    { name:'Spikelet',  at:1, ...star(8,26,16,1),  ...T, size:[.9,1.05] },
    { name:'Spiky',     at:4, ...star(10,40,25,2), size:[.9,1.05] },
    { name:'Spikezilla',at:8, ...star(12,52,32,3), eyeX:13, legLen:1.05, size:[.95,1.05] }]},
  { name:'Pillock', color:'teal', gait:'waddle', forms:[
    { name:'Puff',    at:1, d:cloud(0,-30,26,28,9),  w:28, hat:-57,  eyes:-34, arm:-28, ...T, size:[.9,1.05] },
    { name:'Pillock', at:4, d:cloud(0,-54,46,48,13), w:50, hat:-100, eyes:-60, arm:-46, size:[.9,1.05] },
    { name:'Nimbus',  at:8, d:cloud(0,-66,58,60,17), w:62, hat:-124, eyes:-72, arm:-56, eyeX:14, legLen:1.05, size:[.95,1.05] }]},
  { name:'Dimwit', color:'brown', gait:'march', forms:[
    { name:'Pup',     at:1, ...egg(28,64),  ...T, size:[.9,1.05], back:floppy },
    { name:'Dimwit',  at:4, ...egg(40,112), size:[.9,1.05],       back:floppy },
    { name:'Houndsly',at:8, ...egg(50,142), eyeX:13, legLen:1.05, size:[.95,1.05], back:floppy, over:belly, stripes:true }]},
  { name:'Bunny', color:'pink', gait:'strut', forms:[
    { name:'Bunlet',  at:1, ...egg(24,60),  ...T, size:[.9,1.05], back:bunnyEars, face:whiskers },
    { name:'Bunny',   at:4, ...egg(38,100), size:[.9,1.05],       back:bunnyEars, face:whiskers, tooth:true, holdR:balloon('#e8403f') },
    { name:'Bunzilla',at:8, ...egg(48,126), eyeX:13, legLen:1.05, size:[.95,1.05], back:bunnyEars, face:whiskers, tooth:true, holdR:balloon('#e8403f'), holdL:balloon('#3b82f6'), over:freckles }]},
  { name:'Ninny', color:'orange', gait:'tiptoe', forms:[
    { name:'Nip',     at:1, ...pill(18,72), ...T, eyeX:7, size:[.9,1.05] },
    { name:'Ninny',   at:4, ...GOURD,       size:[.9,1.05] },
    { name:'Gourdon', at:8, ...big(GOURD,1.2,1.12), eyeX:13, legLen:1.05, size:[.95,1.05], back:tufts, stripes:true }]},
];

// ---------- items: drawn in own coords, m = marker; Growth.itemTransform places + sizes them ----------
const HATS = {
  Beanie: {m:[50,60], svg:`<path d="M12 60 Q12 8 50 8 Q88 8 88 60 Z" fill="#e0454b"/><rect x="8" y="52" width="84" height="14" rx="7" fill="#b92f35"/><circle cx="50" cy="6" r="8" fill="#fff"/>`},
  Pilot:  {m:[50,60], svg:`<path d="M10 62 Q8 10 50 10 Q92 10 90 62 Z" fill="#8a5a3a"/><rect x="8" y="48" width="84" height="14" fill="#f2e6c8"/><path d="M10 60 L-2 78 M90 60 L102 78" stroke="#8a5a3a" stroke-width="10" stroke-linecap="round"/>`},
  Party:  {m:[50,70], svg:`<path d="M50 5 L82 70 H18 Z" fill="#ff5d8f"/><circle cx="50" cy="5" r="7" fill="#ffe36e"/><path d="M30 45 H70" stroke="#fff" stroke-width="5"/>`},
  Crown:  {m:[50,60], svg:`<path d="M15 60 L10 15 L32 35 L50 8 L68 35 L90 15 L85 60 Z" fill="#ffd23f" stroke="#e0a800" stroke-width="3"/><circle cx="50" cy="45" r="5" fill="#e0457b"/>`},
  TopHat: {m:[50,70], svg:`<rect x="22" y="10" width="56" height="55" rx="4" fill="#2b2b2b"/><rect x="8" y="62" width="84" height="10" rx="5" fill="#2b2b2b"/><rect x="22" y="48" width="56" height="9" fill="#d94b4b"/>`},
};
const GLASSES = {
  Round:  {m:[50,20], svg:`<circle cx="22" cy="20" r="17" fill="#fff6" stroke="#2b2b2b" stroke-width="4"/><circle cx="78" cy="20" r="17" fill="#fff6" stroke="#2b2b2b" stroke-width="4"/><path d="M39 20 H61" stroke="#2b2b2b" stroke-width="4"/>`},
  Shades: {m:[50,18], svg:`<rect x="4" y="6" width="38" height="24" rx="8" fill="#1d1d28"/><rect x="58" y="6" width="38" height="24" rx="8" fill="#1d1d28"/><path d="M42 14 H58" stroke="#1d1d28" stroke-width="4"/>`},
  Heart:  {m:[50,20], svg:`<path d="M22 36 C-6 18 8 0 22 12 C36 0 50 18 22 36Z" fill="#ff5d8f"/><path d="M78 36 C50 18 64 0 78 12 C92 0 106 18 78 36Z" fill="#ff5d8f"/>`},
};
// toys are held in the left hand; g = grip point inside the toy's own coords
const TOYS = {
  Ball: {g:[0,-14], svg:`<circle cx="0" cy="-14" r="14" fill="#ff6b6b"/><path d="M-14 -14 H14" stroke="#fff" stroke-width="4"/>`},
  Fish: {g:[0,-12], svg:`<ellipse cx="0" cy="-12" rx="18" ry="10" fill="#5ab0f0"/><path d="M16 -12 L30 -22 V-2 Z" fill="#3b8bd0"/><circle cx="-9" cy="-14" r="2.5" fill="#fff"/>`},
  Star: {g:[0,-8],  svg:`<path d="M0-32 L5-20 18-20 8-11 12 2 0-6 -12 2 -8-11 -18-20 -5-20Z" fill="#ffd23f" stroke="#e0a800" stroke-width="2"/>`},
};
const COLORS = ['orange','brown','blue','green','teal','pink','purple','gray'];
const NONE = '';
const TOOTH = `<rect x="-2.4" y="3" width="4.8" height="6" rx="1.4" fill="#fff" stroke="var(--dark)" stroke-width="1"/>`;
const L = (v, f) => typeof v === 'function' ? v(f) : (v || '');

// ---------- gaits ("moods", like the Loop Parade walk cycles): each is just numbers for one generic walk-cycle ----------
// freq cycles/s, stride & lift in local units, bob/squash/lean/roll = body motion, armSwing, sync = both feet together, sl/sr = per-leg stride scale
const GAITS = {
  march:  { freq:1.15, stride:12, lift:9,  bob:3,  squash:.02, lean:0,  roll:0,  armSwing:14 },
  stomp:  { freq:.95,  stride:10, lift:16, bob:5,  squash:.05, lean:-4, roll:3,  armSwing:9  },
  sneak:  { freq:.85,  stride:7,  lift:4,  bob:1,  squash:.02, lean:10, roll:0,  armSwing:3, crouch:8 },
  waddle: { freq:1.05, stride:6,  lift:5,  bob:2,  squash:.03, lean:0,  roll:9,  armSwing:6 },
  bounce: { freq:1.5,  stride:5,  lift:13, bob:13, squash:.12, lean:0,  roll:0,  armSwing:12, sync:true },
  strut:  { freq:.95,  stride:17, lift:6,  bob:3,  squash:.02, lean:-6, roll:4,  armSwing:18 },
  tiptoe: { freq:1.5,  stride:5,  lift:7,  bob:2,  squash:.02, lean:3,  roll:0,  armSwing:8, up:5 },
  limp:   { freq:.85,  stride:12, lift:7,  bob:2,  squash:.02, lean:7,  roll:0,  armSwing:8, sr:.5, dip:6 },
  dance:  { freq:1.25, stride:3,  lift:11, bob:9,  squash:.08, lean:0,  roll:12, armSwing:0, armsUp:true },
};
const GAIT_NAMES = Object.keys(GAITS).filter(k => k !== 'dance');

// ---------- random ----------
const rnd  = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
// like Tabby: index up to 2*len, past the end = no item (~half the time)
const pickOrNone = o => { const k=Object.keys(o); return k.concat(k.map(()=>NONE))[rnd(k.length*2)]; };
const DEFAULT_XP = [20,200,700,170,40];
const roll = (c) => ({ color: Math.random()<.4 ? c.color : pick(COLORS), likesPets: Math.random()>.45, hat:pickOrNone(HATS), glasses:pickOrNone(GLASSES), toy:pickOrNone(TOYS), gait: Math.random()<.4 ? c.gait : pick(GAIT_NAMES) });
const XS = [64,192,320,448,576], GROUND = 258;
const pos = [...XS], dir = [1,1,1,1,1], mode = ['idle','idle','idle','idle','idle']; // idle | dance | walk | home
let pets, sel = 0;
try { pets = JSON.parse(localStorage.beanPets6); } catch {}
if (!Array.isArray(pets) || pets.length!==5) pets = CHARS.map((c,i)=>({...roll(c), color:c.color, gait:c.gait, xp:DEFAULT_XP[i], form:Growth.traits(DEFAULT_XP[i], c.forms).earned}));
const save = () => { try { localStorage.beanPets6 = JSON.stringify(pets); } catch {} };

// ---------- render ----------
const svg = document.getElementById('svg'), hearts = {}, hover = new Set(), evo = {}, GEOM = [], refs = [];
const NS = 'http://www.w3.org/2000/svg';

function petSVG(p, i){
  const sp = CHARS[i], t = Growth.traits(p.xp, sp.forms, p.form), f = inked(t.form), ey = f.eyes, ex = f.eyeX, id = i;
  const legH = 38*f.legLen, hx = Math.min(18, Math.max(6, edgeX(f.dh,-6)*.45)), seg = 8 + f.w*.32;       // long, thin limbs
  GEOM[i] = { legH, hx, legW:f.limbW*1.35, armW:f.limbW*1.15, seg, shX:Math.max(6, edgeX(f.dh, f.arm)-3), shY:f.arm, f };
  const es = f.eyeSize, R = Math.min(7.5*es, ex*1.1), pr = 3.2*es, my = ey + R + 8;      // eye radius, pupil radius, mouth y
  const item = (kind, def) => `<g transform="${Growth.itemTransform(kind, f, def)}">${def.svg}</g>`;
  const toy = p.toy ? (T_ => `<g transform="translate(${-T_.g[0]*.8} ${-T_.g[1]*.8}) scale(.8)">${T_.svg}</g>`)(TOYS[p.toy]) : '';
  const hold = { L: toy || L(f.holdL, f), R: L(f.holdR, f) };
  const tube = `fill="none" stroke="var(--base)" stroke-width="${GEOM[i].armW}" stroke-linecap="round" stroke-linejoin="round"`;
  const leg  = c => `<g class="${c}"><path fill="none" stroke="var(--base)" stroke-width="${GEOM[i].legW}" stroke-linecap="round" stroke-linejoin="round"/><ellipse rx="7" ry="3.3" class="acc"/></g>`;
  const fingers = side => [-40,-14,13,38].map(a => `M0 2 L${(Math.sin(a*Math.PI/180)*7.5).toFixed(1)} ${(2+Math.cos(a*Math.PI/180)*7.5).toFixed(1)}`).join(' ') + ` M${side*-2} 0 L${(side*-6.5).toFixed(1)} 4`;
  const hand = side => `<g class="hd"><path d="${fingers(side)}" stroke="var(--acc)" stroke-width="1.9" stroke-linecap="round" fill="none"/><circle r="3.6" class="acc"/></g>`;
  const eye = s => `<g class="eye"><circle cx="${s*ex}" cy="${ey}" r="${R}" fill="#fff"/><circle class="pup" cx="${s*ex}" cy="${ey}" r="${pr+1.7}" fill="var(--acc)"/><circle class="pup" cx="${s*ex}" cy="${ey}" r="${pr}" fill="var(--dark)"/><circle class="pup" cx="${s*ex+1.1}" cy="${ey-1.3}" r="${pr*.3}" fill="#fff"/></g>`;
  const stripes = f.stripes ? Array.from({length:6}, (_,k) => { const y = -7 - k*9; return `<path d="M${-f.w*1.4} ${y} Q0 ${y+3} ${f.w*1.4} ${y}" stroke="#fff" stroke-width="2.2" fill="none" opacity=".95"/>`; }).join('') : '';
  return `<g class="pet c-${p.color} ${p.likesPets?'likes':'hates'} ${evo[i]?'evolving':''}" data-i="${i}" transform="translate(${pos[i]} ${GROUND})">
    <defs><clipPath id="cp${id}"><path d="${f.dh}"/></clipPath></defs>
    <g class="grow" transform="scale(${t.scale})"><g class="pw">
      <ellipse cx="0" cy="2" rx="${Math.max(30,f.w*1.05)}" ry="6" fill="#000" opacity=".12"/>
      ${leg('legL')}${leg('legR')}
      <g class="body">
        <path class="tubeL" ${tube}/><path class="tubeR" ${tube}/>
        ${L(f.back,f)}
        <path class="fill" d="${f.dh}"/>
        <g clip-path="url(#cp${id})">${stripes}${L(f.over,f)}</g>
        <g class="face">
          ${eye(-1)}${eye(1)}
          ${L(f.face,f)}
          <g transform="translate(0 ${my})">
            <g class="m-smile"><path d="M-10 0 Q0 11 10 0" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round"/>${f.tooth ? TOOTH : ''}</g>
            <g class="m-open"><path d="M-11 -1 Q0 15 11 -1Z" fill="var(--acc)" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/></g>
            <g class="m-o"><ellipse cx="0" cy="3" rx="3.2" ry="4.2" fill="none" stroke="#fff" stroke-width="2.4"/></g>
          </g>
        </g>
        ${p.glasses ? item('glasses', GLASSES[p.glasses]) : ''}
        ${p.hat ? item('hat', HATS[p.hat]) : ''}
        <g class="handL">${hand(-1)}${hold.L}</g>
        <g class="handR">${hand(1)}${hold.R}</g>
      </g>
    </g></g>
    <text class="label" y="32">${f.name}</text>
    ${i===sel ? `<path class="sel-mark" d="M-6 46 L6 46 L0 39Z"/>` : ''}
  </g>`;
}
function bindRefs(){
  svg.querySelectorAll('.pet').forEach(el => { const i=+el.dataset.i, q = s => el.querySelector(s);
    refs[i] = { el, body:q('.body'), face:q('.face'), pups:[...el.querySelectorAll('.pup')], tubeL:q('.tubeL'), tubeR:q('.tubeR'), handL:q('.handL'), handR:q('.handR'), hdL:q('.handL .hd'), hdR:q('.handR .hd'),
                legLp:q('.legL path'), legLe:q('.legL ellipse'), legRp:q('.legR path'), legRe:q('.legR ellipse') }; });
}
function xpUI(){
  const p = pets[sel], t = Growth.traits(p.xp, CHARS[sel].forms, p.form);
  const nx = t.nextForm ? ` · evolves into ${t.nextForm.name} at Lv ${t.nextForm.at} (${t.nextForm.xp} xp)` : ' · final form';
  document.getElementById('xpinfo').textContent = `Lv ${t.level} · ${Math.floor(t.xp)}/${t.nextLevelXp} xp${nx}`;
  document.getElementById('xp').value = t.levelFrac;
}
function render(){
  Object.values(hearts).forEach(clearInterval);
  svg.innerHTML = pets.map(petSVG).join('');
  bindRefs(); hover.forEach(startHearts);
  CHARS.forEach((_,i) => applyPose(i, LAST[i] || restPose(i)));       // no un-posed frame after a re-render
  xpUI();
  const p = pets[sel];
  document.getElementById('name').textContent = CHARS[sel].forms[p.form].name + (p.likesPets ? ' · loves pets' : ' · hates pets');
  for (const [id,vals,cur] of [['color',COLORS,p.color],['hat',Object.keys(HATS),p.hat],['glasses',Object.keys(GLASSES),p.glasses],['toy',Object.keys(TOYS),p.toy],['gait',GAIT_NAMES,p.gait]])
    document.getElementById(id).innerHTML = (id==='color'||id==='gait' ? '' : `<option value="">no ${id}</option>`)+vals.map(v=>`<option value="${v}" ${v===cur?'selected':''}>${id==='gait'?'walk: ':''}${v}</option>`).join('');
  save();
}

// ---------- the rig: two-bone IK for legs and arms, one generic walk cycle driven by GAITS ----------
const TAU = Math.PI*2, S = Math.sin, C = Math.cos;
const LAST = [], A = CHARS.map(() => ({ ph:Math.random(), k:0, hop:0 }));
function ik(H, F, a, b, bend){                      // returns [knee/elbow, reachable end]
  let dx=F[0]-H[0], dy=F[1]-H[1]; const dist = Math.hypot(dx,dy) || 1e-6, d = Math.min(dist, a+b-.01);
  const end = [H[0]+dx*d/dist, H[1]+dy*d/dist], base = Math.atan2(dy,dx);
  const ang = base + bend*Math.acos(Math.max(-1, Math.min(1, (a*a+d*d-b*b)/(2*a*d))));
  return [[H[0]+a*C(ang), H[1]+a*S(ang)], end];
}
const footAt = (u, beta=.55) => { u = ((u%1)+1)%1; return u<beta ? [1-2*u/beta, 0] : [-1+2*(u-beta)/(1-beta), S(Math.PI*(u-beta)/(1-beta))]; };
const hop = i => { A[i].hop = .6; };

function restPose(i){ const s = GEOM[i].seg; return { by:0, lean:0, sx:1, sy:1, footL:[-GEOM[i].hx,0], footR:[GEOM[i].hx,0], handL:[-s*.4,s*1.45], handR:[s*.4,s*1.45], look:0, gaze:[0,0], happy:false }; }
function pose(i, dt, t){
  const a=A[i], p=pets[i], G=GEOM[i], m=mode[i], dr=dir[i], likes=p.likesPets, busy=!!evo[i];
  const moving = !busy && (m==='walk' || m==='home' || m==='dance');
  const g = m==='dance' ? GAITS.dance : (GAITS[p.gait] || GAITS.march);
  a.k += ((moving?1:0) - a.k) * Math.min(1, dt*8); const k = a.k;
  if (moving) a.ph += dt*g.freq;
  const ph = a.ph, hov = hover.has(i) && !busy;
  let by=0, lean=0, sx=1, sy=1;
  if (!busy) { const br = S(TAU*t/3 + i); sy += .022*br; sx -= .011*br; }              // breathing
  // legs: stance (foot slides back) then swing (foot lifts forward)
  const ls = G.legH/27, fl = footAt(ph), fr = footAt(g.sync ? ph : ph+.5), str = g.stride*k*dr*ls;
  const footL = [-G.hx + fl[0]*str*(g.sl??1), -fl[1]*g.lift*k*ls], footR = [G.hx + fr[0]*str*(g.sr??1), -fr[1]*g.lift*k*ls];
  by += -g.bob*k*(g.sync ? fl[1] : Math.abs(S(TAU*ph))) + (g.crouch||0)*k - (g.up||0)*k + (g.dip||0)*k*Math.max(0, S(TAU*ph));
  const sq = g.squash*k*C(TAU*(g.sync ? ph : 2*ph)); sy *= 1 - sq; sx *= 1 + sq;
  lean = dr*(g.lean||0)*k + (g.roll||0)*k*S(TAU*ph);
  // being petted
  if (hov && likes) { const b = S(TAU*2.8*t); sy *= 1 + .07*b; sx *= 1 - .04*b; }
  if (hov && !likes) lean += 3*S(t*55);
  // idle hop: body leaves the ground, feet follow
  let air = 0;
  if (a.hop > 0) { const pp = 1 - a.hop/.6; air = S(Math.PI*pp); by += -26*air; sy *= 1 + .08*air; sx *= 1 - .05*air; a.hop -= dt; footL[1] += by*.7; footR[1] += by*.7; }
  // arms: hang -> out (likes pets) -> up (dance / petted / hop), plus swing against the legs
  const up = Math.max(g.armsUp ? k : 0, hov && likes ? 1 : 0, air);
  const sg = G.seg, hands = [-1,1].map(side => {
    const rest = likes && !moving ? [side*sg*.55, sg*1.3] : [side*sg*.4, sg*1.45];
    const sw = dr*(g.armSwing||0)*(sg/16)*k*S(TAU*(ph + (side<0 ? 0 : .5)));
    const hi = [side*sg*1.0, -sg*1.05 + 7*S(TAU*(moving ? 2*ph : 3*t) + side)];
    return [rest[0]*(1-up) + hi[0]*up + sw, rest[1]*(1-up) + hi[1]*up - Math.abs(sw)*.2];
  });
  // pupils drift around when idle and look where they walk
  const gaze = [dr*2.1*k + 1.4*S(t*.6 + i*2)*(1-k), 1.0*C(t*.45 + i)];
  return { by, lean, sx, sy, footL, footR, handL:hands[0], handR:hands[1], look:dr*3*k, gaze, happy: !busy && likes && (hov || m==='dance') };
}
function applyPose(i, P){
  const r = refs[i], G = GEOM[i]; if (!r) return; LAST[i] = P;
  r.body.setAttribute('transform', `translate(0 ${-G.legH+P.by}) rotate(${P.lean}) scale(${P.sx} ${P.sy})`);
  r.face.setAttribute('transform', `translate(${P.look} 0)`);
  r.pups.forEach(u => u.setAttribute('transform', `translate(${P.gaze[0].toFixed(2)} ${P.gaze[1].toFixed(2)})`));
  r.el.classList.toggle('happy', P.happy);
  const len = G.legH + 8, bendDir = dir[i]>0 ? -1 : 1;   // straight while planted, knee folds forward when the foot lifts
  for (const [side, foot, lp, le] of [[-1,P.footL,r.legLp,r.legLe],[1,P.footR,r.legRp,r.legRe]]) {
    const H = [side*G.hx, -G.legH+P.by-8], [K,F] = ik(H, foot, len/2, len/2, bendDir);
    lp.setAttribute('d', `M${H[0]} ${H[1]} L${K[0].toFixed(1)} ${K[1].toFixed(1)} L${F[0].toFixed(1)} ${F[1].toFixed(1)}`);
    le.setAttribute('cx', (F[0]+dir[i]*3).toFixed(1)); le.setAttribute('cy', F[1].toFixed(1));
  }
  for (const [side, hand, tube, hg, hd] of [[-1,P.handL,r.tubeL,r.handL,r.hdL],[1,P.handR,r.tubeR,r.handR,r.hdR]]) {
    const Sh = [side*G.shX, G.shY], Ht = [Sh[0]+hand[0], Sh[1]+hand[1]];
    const [E,End] = ik(Sh, Ht, G.seg, G.seg, -side*(hand[1] < 0 ? -1 : 1));
    tube.setAttribute('d', `M${Sh[0]} ${Sh[1]} L${E[0].toFixed(1)} ${E[1].toFixed(1)} L${End[0].toFixed(1)} ${End[1].toFixed(1)}`);
    hg.setAttribute('transform', `translate(${End[0].toFixed(1)} ${End[1].toFixed(1)})`);
    hd.setAttribute('transform', `rotate(${(Math.atan2(End[1]-E[1], End[0]-E[0])*180/Math.PI - 90).toFixed(1)})`);   // fingers follow the forearm
  }
}

// ---------- idle + pet actions ----------
const g = i => svg.querySelector(`.pet[data-i="${i}"]`);
function blink(i){ const el=g(i); if(el){ el.classList.add('blink'); setTimeout(()=>el.classList.remove('blink'),150); } setTimeout(()=>blink(i), 600+Math.random()*3500); }
CHARS.forEach((_,i)=>setTimeout(()=>blink(i), Math.random()*2000));
setInterval(()=>{ const i=rnd(5); if(!hover.has(i) && mode[i]==='idle' && !evo[i]) hop(i); }, 2500);

function startHearts(i){
  clearInterval(hearts[i]);
  if(!pets[i].likesPets) return;
  hearts[i]=setInterval(()=>{
    addXp(i,'pet');
    const t=document.createElementNS(NS,'text'); t.textContent='❤'; t.setAttribute('class','heart');
    t.setAttribute('x', pos[i]-20+Math.random()*40); t.setAttribute('y', 120+Math.random()*30);
    svg.append(t); setTimeout(()=>t.remove(),1000);
  }, 250);
}
svg.addEventListener('mouseover', e => { const el=e.target.closest('.pet'); if(!el) return; const i=+el.dataset.i; if(!hover.has(i)){ hover.add(i); startHearts(i); } });
svg.addEventListener('mouseout',  e => { const el=e.target.closest('.pet'); if(!el || el.contains(e.relatedTarget)) return; const i=+el.dataset.i; hover.delete(i); clearInterval(hearts[i]); });
svg.addEventListener('click', e => { const el=e.target.closest('.pet'); if(el){ sel=+el.dataset.i; render(); } });

// ---------- growth + evolution ----------
function float(i, text, cls, y=60){
  const t=document.createElementNS(NS,'text'); t.textContent=text; t.setAttribute('class',cls);
  t.setAttribute('x', pos[i]); t.setAttribute('y', y); svg.append(t); setTimeout(()=>t.remove(),1500);
}
function addXp(i, event, amount=1){
  const before = Growth.traits(pets[i].xp, CHARS[i].forms, pets[i].form), r = Growth.gain(pets[i].xp, event, amount);
  pets[i].xp = r.xp; const after = Growth.traits(r.xp, CHARS[i].forms, pets[i].form);
  if (r.leveledUp) float(i,'LEVEL UP!','lvl');
  // eyes/legs are quantised: re-render only when q moves a step or the level changes; otherwise just rescale
  if (r.leveledUp || Math.round(after.q*25) !== Math.round(before.q*25)) render();
  else g(i)?.querySelector('.grow')?.setAttribute('transform', `scale(${after.scale})`);
  if (i===sel) xpUI();
  checkEvolution(i);
}
function checkEvolution(i){
  const to = Growth.evolutionDue(pets[i].xp, CHARS[i].forms, pets[i].form);
  if (to >= 0 && !evo[i]) evolve(i, to);
}
// flash the old silhouette ~2s, then swap to the new form with a burst + sparkles (items re-fit by themselves)
function evolve(i, to){
  const sp = CHARS[i], from = sp.forms[pets[i].form].name;
  evo[i] = true; mode[i] = 'idle'; render();
  setTimeout(()=>{
    pets[i].form = to; delete evo[i]; render();
    g(i)?.classList.add('pop'); setTimeout(()=>g(i)?.classList.remove('pop'), 1000);
    const b=document.createElementNS(NS,'circle'); b.setAttribute('class','burst'); b.setAttribute('cx',pos[i]); b.setAttribute('cy',170); b.setAttribute('r',14);
    svg.append(b); setTimeout(()=>b.remove(),1000);
    for (let k=0;k<10;k++){
      const ang=k/10*Math.PI*2, t=document.createElementNS(NS,'text'); t.textContent='✦'; t.setAttribute('class','spark');
      t.setAttribute('x',pos[i]); t.setAttribute('y',160); t.style.setProperty('--dx',C(ang)*90+'px'); t.style.setProperty('--dy',S(ang)*90+'px');
      svg.append(t); setTimeout(()=>t.remove(),1200);
    }
    float(i, `${from} evolved into ${sp.forms[to].name}!`, 'lvl', 4);
    checkEvolution(i);                      // chained evolution if xp jumped several forms
  }, 2200);
}
setInterval(save, 3000);
document.getElementById('feed').onclick = () => { float(sel,'🍎','heart'); addXp(sel,'feed'); hop(sel); };
document.getElementById('evolve').onclick = () => {   // jump to the next form's level
  const nx = CHARS[sel].forms[pets[sel].form+1]; if (!nx || evo[sel]) return;
  pets[sel].xp = Math.max(pets[sel].xp, Math.ceil(Growth.xpForLevel(nx.at))); render(); checkEvolution(sel);
};

// ---------- main loop: pose every pet each frame, move walkers so feet don't slide ----------
const setMode = (i, m) => { if (evo[i]) return; mode[i] = (mode[i]===m ? (m==='walk' ? 'home' : 'idle') : m); };
let last = performance.now();
(function tick(now){
  const dt = Math.min((now-last)/1000, .1), t = now/1000; last = now;
  for (let i=0;i<5;i++){
    if (!GEOM[i]) continue;                 // first frame runs before the first render
    const m = mode[i];
    if (m==='dance') addXp(i,'dance',dt);
    if (m==='walk' || m==='home') {
      addXp(i,'walk',dt);
      const gt = GAITS[pets[i].gait] || GAITS.march, sp = 2*gt.stride*gt.freq/.55*Growth.traits(pets[i].xp, CHARS[i].forms, pets[i].form).scale;
      if (m==='walk') { pos[i] += dir[i]*sp*dt; if (pos[i]>600) { pos[i]=600; dir[i]=-1; } if (pos[i]<40) { pos[i]=40; dir[i]=1; } }
      else { const d = XS[i]-pos[i]; dir[i] = Math.sign(d)||1; if (Math.abs(d) < sp*dt) { pos[i]=XS[i]; mode[i]='idle'; } else pos[i] += dir[i]*sp*dt; }
    }
    refs[i]?.el.setAttribute('transform', `translate(${pos[i]} ${GROUND})`);
    applyPose(i, pose(i, dt, t));
  }
  requestAnimationFrame(tick);
})(last);
const act = () => render();
document.getElementById('dance').onclick    = () => { if (mode[sel]==='walk') mode[sel]='home'; setMode(sel,'dance'); act(); };
document.getElementById('run').onclick      = () => { setMode(sel,'walk'); act(); };
document.getElementById('danceAll').onclick = () => { const on = mode.some(m=>m!=='dance'); mode.forEach((_,i)=>{ mode[i]= evo[i] ? 'idle' : on?'dance':'idle'; }); act(); };
document.getElementById('runAll').onclick   = () => { mode.forEach((_,i)=>{ if(!evo[i]){ mode[i]='walk'; dir[i]= i%2? -1:1; } }); act(); };
document.getElementById('stop').onclick     = () => { mode.forEach((m,i)=>mode[i]= m==='walk' ? 'home' : 'idle'); act(); };

// ---------- ui ----------
document.getElementById('roll').onclick    = () => { pets[sel]={...roll(CHARS[sel]), xp:pets[sel].xp, form:pets[sel].form}; render(); };
document.getElementById('rollAll').onclick = () => { pets=CHARS.map((c,i)=>({...roll(c), xp:pets[i].xp, form:pets[i].form})); render(); };
for (const k of ['color','hat','glasses','toy','gait'])
  document.getElementById(k).onchange = e => { pets[sel][k]=e.target.value; render(); };
render();
</script>
</body>
</html>
