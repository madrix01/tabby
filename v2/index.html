<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blobbies</title>
<style>
  :root { --ink:#161616; --red:#e8494b; --yellow:#f6c945; --blue:#3a85f2; --paper:#ffffff; --sans:"Avenir Next","Futura","Trebuchet MS",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
         color:var(--ink); font:16px/1.4 var(--sans); background:var(--paper); }
  h1 { margin:0; font:800 1.3rem var(--sans); letter-spacing:.28em; text-transform:uppercase; }
  #stage { width:min(98vw,1040px); }
  svg { width:100%; height:auto; overflow:visible; display:block; }
  .pet { cursor:pointer; }
  .label { font:700 10px var(--sans); letter-spacing:.24em; text-anchor:middle; fill:var(--ink); text-transform:uppercase; }

  /* two-colour print: a body colour and an accent for hands, feet, pupils and props */
  .c-red    { --base:#e8494b; --acc:#f6c945; }
  .c-yellow { --base:#f6c945; --acc:#e8494b; }
  .c-blue   { --base:#3a85f2; --acc:#f6c945; }
  .fill { fill:var(--base); }
  .acc  { fill:var(--acc); }
  .ink  { fill:var(--ink); }
  /* white parts of props get an ink outline so they read on the white page */
  .item [fill="#fff"] { stroke:var(--ink); stroke-width:2.5; stroke-linejoin:round; }

  /* all body motion (walk cycle, squash, arms, legs) is driven by the rig in JS; CSS only does small face loops */
  .eye { transform-box:fill-box; transform-origin:50% 50%; transition:transform .08s; }
  .blink .eye { transform:scaleY(.1); }
  .m-smile, .m-open, .m-o { display:none; }
  .likes .m-smile, .hates .m-o { display:inline; }
  .likes.happy .m-smile { display:none; } .likes.happy .m-open { display:inline; }

  /* evolution: flash a white silhouette, then pop into the new form */
  .pet.evolving .grow { animation:evoFlash .32s steps(1) infinite; }
  .pw { transform-box:fill-box; transform-origin:50% 100%; }
  .pet.pop .pw { animation:pop .9s cubic-bezier(.3,1.7,.5,1) 1; }
  .spark { font-size:18px; fill:var(--yellow); pointer-events:none; animation:spark 1.2s ease-out forwards; }
  .burst { fill:var(--yellow); pointer-events:none; transform-box:fill-box; transform-origin:50% 50%; animation:burst 1s ease-out forwards; }
  .sel-mark { fill:var(--red); }
  .heart { font-size:20px; fill:var(--red); pointer-events:none; animation:up 1s ease-out forwards; }
  .lvl { font:800 13px var(--sans); letter-spacing:.1em; fill:var(--red); pointer-events:none; text-anchor:middle; animation:up 1.4s ease-out forwards; }
  @keyframes evoFlash { 0% { filter:none; } 50% { filter:brightness(0) drop-shadow(0 0 8px var(--yellow)); } }
  @keyframes pop   { 0% { transform:scale(.2,.2); } 60% { transform:scale(1.15,1.15); } 100% { transform:scale(1,1); } }
  @keyframes spark { from { transform:translate(0,0) scale(.3); opacity:1; } to { transform:translate(var(--dx),var(--dy)) scale(1.2); opacity:0; } }
  @keyframes burst { from { transform:scale(.2); opacity:.95; } to { transform:scale(9); opacity:0; } }
  @keyframes up { to { transform:translateY(-60px); opacity:0; } }

  progress { width:200px; height:8px; accent-color:var(--red); }
  #xpinfo { min-width:100%; text-align:center; font-size:13px; letter-spacing:.04em; }
  #ui { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:720px; padding:0 12px; align-items:center; }
  select, button { font:600 14px var(--sans); padding:6px 12px; border-radius:99px; border:2px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer; }
  button:hover { background:var(--ink); color:#fff; }
  #name { font-weight:800; min-width:100%; text-align:center; letter-spacing:.2em; text-transform:uppercase; }
</style>
</head>
<body>
  <h1>Blobbies</h1>
  <div id="stage"><svg id="svg" viewBox="-30 -30 760 350"></svg></div>
  <div id="ui">
    <div id="name"></div>
    <div id="xpinfo"></div><div style="min-width:100%;text-align:center"><progress id="xp" max="1" value="0"></progress></div>
    <select id="color"></select>
    <select id="hat"></select>
    <select id="glasses"></select>
    <select id="toy"></select>
    <select id="gait"></select>
    <button id="roll">Reroll this one</button>
    <button id="rollAll">Reroll all</button>
    <span style="min-width:100%"></span>
    <button id="dance">Dance</button>
    <button id="run">Walk</button>
    <button id="danceAll">Dance party</button>
    <button id="runAll">Parade</button>
    <button id="stop">Stop all</button>
    <button id="feed">Feed 🍎</button>
    <button id="evolve">Evolve ⚡</button>
  </div>
<script src="growth.js"></script>
<script>
// ---------- body shapes (local coords: origin = bottom centre of the body, up is negative) ----------
// every shape returns { d, w (half width), hat (head top), eyes (eye line), arm (shoulder height) }
const heart = (w,h) => ({ d:`M0 0 C${-w*.2} ${-h*.12} ${-w*1.15} ${-h*.42} ${-w} ${-h*.78} C${-w*.85} ${-h*1.08} ${-w*.2} ${-h*1.06} 0 ${-h*.84} C${w*.2} ${-h*1.06} ${w*.85} ${-h*1.08} ${w} ${-h*.78} C${w*1.15} ${-h*.42} ${w*.2} ${-h*.12} 0 0Z`, w:w*.9, hat:-h*.98, eyes:-h*.6, arm:-h*.5 });
const ball  = r => ({ d:`M0 0 A${r} ${r} 0 1 1 0 ${-2*r} A${r} ${r} 0 1 1 0 0Z`, w:r, hat:-2*r*.97, eyes:-r*1.15, arm:-r*.95 });
const pill  = (w,h) => ({ d:`M${-w} ${-h+w} A${w} ${w} 0 0 1 ${w} ${-h+w} V${-w} A${w} ${w} 0 0 1 ${-w} ${-w}Z`, w, hat:-h, eyes:-h*.76, arm:-h*.55 });
function fur(n, R, r, seed=1){                 // shaggy ball: many short spikes
  const cy = -R*.95; let d = '';
  for (let k=0;k<2*n;k++){ const a = Math.PI*k/n - Math.PI/2, rad = (k%2 ? r : R)*(1 + .08*Math.sin(k*2.3+seed)); d += `${k?'L':'M'}${(rad*Math.cos(a)).toFixed(1)} ${(cy+rad*Math.sin(a)).toFixed(1)}`; }
  return { d:d+'Z', w:R*.78, hat:cy-R*.9, eyes:cy-R*.08, arm:cy+R*.05 };
}
const sc = (d, kx, ky = kx) => { let ax = 0; return d.replace(/[MCLZ]|-?\d*\.?\d+/g, t => /[A-Z]/.test(t) ? (ax = 0, t) : (+t * (ax++ % 2 ? ky : kx)).toFixed(1)); };
const PEAR = { d:'M-26 -100 C-26 -135 -20 -150 0 -150 C20 -150 26 -135 26 -100 C26 -85 40 -75 40 -45 C40 -15 20 0 0 0 C-20 0 -40 -15 -40 -45 C-40 -75 -26 -85 -26 -100Z', w:38, hat:-148, eyes:-122, arm:-66 };
const big = (b,kx,ky=kx) => ({ d:sc(b.d,kx,ky), w:b.w*kx, hat:b.hat*ky, eyes:b.eyes*ky, arm:b.arm*ky });

// silhouette half-width at height y, measured from the real path so arms/legs always start inside the body edge
const probe = document.createElementNS('http://www.w3.org/2000/svg','svg'); probe.setAttribute('style','position:absolute;width:0;height:0;visibility:hidden');
const probePath = document.createElementNS('http://www.w3.org/2000/svg','path'); probe.append(probePath); document.body.append(probe);
const profiles = {};
function edgeX(d, y){
  if (!profiles[d]) { probePath.setAttribute('d', d); const L = probePath.getTotalLength(); profiles[d] = Array.from({length:361}, (_,k) => probePath.getPointAtLength(L*k/360)); }
  const pts = profiles[d]; let m = 0;
  for (let k=0;k<pts.length-1;k++){ const a=pts[k], b=pts[k+1]; if ((a.y-y)*(b.y-y)<=0 && a.y!==b.y) m = Math.max(m, Math.abs(a.x+(b.x-a.x)*(y-a.y)/(b.y-a.y))); }
  return m;
}

// extra art: functions of the form so they follow its size (over = on the body, face = on the face)
const lashes = f => [-1,1].map(s => `<path d="M${s*(f.eyeX+7)} ${f.eyes-6} l${s*5} -5 M${s*(f.eyeX+3)} ${f.eyes-9} l${s*3} -6 M${s*(f.eyeX+10)} ${f.eyes-2} l${s*6} -2" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" fill="none"/>`).join('');
const tongue = f => `<ellipse cx="${f.eyeX*.9}" cy="${f.eyes+f.eyeSize*7.5+17}" rx="3.4" ry="2.6" transform="rotate(-25 ${f.eyeX*.9} ${f.eyes+f.eyeSize*7.5+17})" fill="var(--acc)"/>`;

// ---------- species = chain of forms (Growth.formAt picks the form from level) ----------
// legH = leg length, seg = arm bone length (arm = 2 seg), limbW = limb thickness. baby forms: short limbs, big eyes.
const B = { eyeSize:1.2, eyeX:8 };
const CHARS = [
  { name:'Heartly', color:'red', gait:'strut', forms:[
    { name:'Heartlet',   at:1, ...heart(26,44), ...B, legH:24, seg:13, limbW:3.4, size:[.9,1.05] },
    { name:'Heartly',    at:4, ...heart(44,70), eyeX:12, legH:50, seg:26, limbW:4.2, size:[.9,1.05] },
    { name:'Heartzilla', at:8, ...heart(54,84), eyeX:14, legH:74, seg:36, limbW:4.8, size:[.95,1.05] }]},
  { name:'Longo', color:'blue', gait:'stomp', forms:[
    { name:'Dot',        at:1, ...ball(24), ...B, legH:26, seg:13, limbW:3.4, size:[.9,1.05] },
    { name:'Longo',      at:4, ...ball(38), eyeX:12, legH:72, seg:38, limbW:4.4, size:[.9,1.05] },
    { name:'Longissimo', at:8, ...ball(44), eyeX:14, legH:104, seg:52, limbW:5, size:[.95,1.05], stripes:true }]},
  { name:'Frank', color:'yellow', gait:'march', forms:[
    { name:'Weenie',     at:1, ...pill(15,52), ...B, legH:16, seg:12, limbW:3.2, size:[.9,1.05] },
    { name:'Frank',      at:4, ...pill(26,106), eyeX:11, legH:30, seg:24, limbW:4.2, size:[.9,1.05], face:tongue },
    { name:'Wurstmeister',at:8,...pill(30,132), eyeX:13, legH:40, seg:30, limbW:4.8, size:[.95,1.05], face:tongue, stripes:true }]},
  { name:'Fuzz', color:'blue', gait:'bounce', forms:[
    { name:'Fluff',      at:1, ...fur(20,26,21,1), ...B, legH:16, seg:12, limbW:3.2, size:[.9,1.05] },
    { name:'Fuzz',       at:4, ...fur(24,40,32,2), eyeX:12, legH:24, seg:22, limbW:4, size:[.9,1.05] },
    { name:'Fuzzilla',   at:8, ...fur(28,52,42,3), eyeX:15, legH:30, seg:30, limbW:4.6, size:[.95,1.05] }]},
  { name:'Pearl', color:'red', gait:'tiptoe', forms:[
    { name:'Pip',        at:1, ...big(PEAR,.5), ...B, legH:26, seg:12, limbW:3, size:[.9,1.05] },
    { name:'Pearl',      at:4, ...big(PEAR,.92,.92), eyeX:10, legH:76, seg:36, limbW:3.6, size:[.9,1.05], face:lashes },
    { name:'Madame',     at:8, ...big(PEAR,1.1,1.05), eyeX:12, legH:88, seg:42, limbW:4, size:[.95,1.05], face:lashes, stripes:true }]},
];

// ---------- items: flat shapes in the two print colours; m = marker; Growth.itemTransform places + sizes them ----------
const HATS = {
  Chef:   {m:[50,64], svg:`<path d="M28 64 V42 Q8 42 10 24 Q12 6 32 14 Q42 -2 58 12 Q82 6 90 24 Q94 42 72 42 V64Z" fill="#fff"/>`},
  Cap:    {m:[50,62], svg:`<path d="M14 62 Q14 14 50 14 Q86 14 86 62Z" fill="#fff"/><path d="M80 58 Q114 56 110 68 H78Z" fill="var(--acc)"/>`},
  Party:  {m:[50,70], svg:`<path d="M50 5 L82 70 H18 Z" fill="var(--acc)"/><circle cx="50" cy="5" r="7" fill="#fff"/><path d="M33 48 H67 M40 30 H60" stroke="#fff" stroke-width="4"/>`},
  Beanie: {m:[50,62], svg:`<path d="M14 62 Q14 8 50 8 Q86 8 86 62Z" fill="var(--acc)"/><rect x="10" y="52" width="80" height="14" rx="7" fill="#fff"/><circle cx="50" cy="6" r="8" fill="#fff"/>`},
  Crown:  {m:[50,60], svg:`<path d="M15 60 L10 15 L32 35 L50 8 L68 35 L90 15 L85 60 Z" fill="#fff"/><circle cx="50" cy="46" r="5" fill="var(--acc)"/>`},
};
const GLASSES = {
  Round:  {m:[50,20], svg:`<circle cx="22" cy="20" r="17" fill="none" stroke="var(--ink)" stroke-width="4.5"/><circle cx="78" cy="20" r="17" fill="none" stroke="var(--ink)" stroke-width="4.5"/><path d="M39 20 H61" stroke="var(--ink)" stroke-width="4.5"/>`},
  Shades: {m:[50,18], svg:`<rect x="4" y="6" width="38" height="24" rx="8" fill="var(--acc)"/><rect x="58" y="6" width="38" height="24" rx="8" fill="var(--acc)"/><path d="M42 14 H58" stroke="var(--acc)" stroke-width="4.5"/>`},
  Heart:  {m:[50,20], svg:`<path d="M22 36 C-6 18 8 0 22 12 C36 0 50 18 22 36Z" fill="#fff"/><path d="M78 36 C50 18 64 0 78 12 C92 0 106 18 78 36Z" fill="#fff"/>`},
};
// toys are held in the left hand; g = grip point inside the toy's own coords
const TOYS = {
  Bottle: {g:[0,-4],  svg:`<rect x="-8" y="-34" width="16" height="32" rx="5" fill="#fff"/><rect x="-6" y="-42" width="12" height="9" rx="3" fill="var(--acc)"/><path d="M-8 -22 H8" stroke="var(--acc)" stroke-width="2"/>`},
  Tray:   {g:[0,0],   svg:`<path d="M-34 -3 H34" stroke="var(--acc)" stroke-width="4.5" stroke-linecap="round"/><path d="M-18 -3 Q0 -12 18 -3" fill="#fff"/>`},
  Ball:   {g:[0,-14], svg:`<circle cx="0" cy="-14" r="14" fill="var(--acc)"/><path d="M-14 -14 H14" stroke="#fff" stroke-width="4"/>`},
};
const COLORS = ['red','yellow','blue'];
const NONE = '';
const L = (v, f) => typeof v === 'function' ? v(f) : (v || '');

// ---------- gaits ("moods"): each is just numbers for one generic walk-cycle ----------
// freq cycles/s, stride & lift in local units (scaled by leg length), bob/squash/lean/roll = body motion, armSwing, sync = both feet together, sl/sr = per-leg stride scale
const GAITS = {
  march:  { freq:1.15, stride:12, lift:9,  bob:3,  squash:.02, lean:0,  roll:0,  armSwing:14 },
  stomp:  { freq:.95,  stride:10, lift:16, bob:5,  squash:.05, lean:-4, roll:3,  armSwing:9  },
  sneak:  { freq:.85,  stride:7,  lift:4,  bob:1,  squash:.02, lean:10, roll:0,  armSwing:3, crouch:8 },
  waddle: { freq:1.05, stride:6,  lift:5,  bob:2,  squash:.03, lean:0,  roll:9,  armSwing:6 },
  bounce: { freq:1.5,  stride:5,  lift:13, bob:13, squash:.12, lean:0,  roll:0,  armSwing:12, sync:true },
  strut:  { freq:.95,  stride:17, lift:6,  bob:3,  squash:.02, lean:-6, roll:4,  armSwing:18 },
  tiptoe: { freq:1.5,  stride:5,  lift:7,  bob:2,  squash:.02, lean:3,  roll:0,  armSwing:8, up:5 },
  limp:   { freq:.85,  stride:12, lift:7,  bob:2,  squash:.02, lean:7,  roll:0,  armSwing:8, sr:.5, dip:6 },
  dance:  { freq:1.25, stride:3,  lift:11, bob:9,  squash:.08, lean:0,  roll:12, armSwing:0, armsUp:true },
};
const GAIT_NAMES = Object.keys(GAITS).filter(k => k !== 'dance');

// ---------- random ----------
const rnd  = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
// like Tabby: index up to 2*len, past the end = no item (~half the time)
const pickOrNone = o => { const k=Object.keys(o); return k.concat(k.map(()=>NONE))[rnd(k.length*2)]; };
const DEFAULT_XP = [200,60,200,60,200];
const roll = (c) => ({ color: Math.random()<.55 ? c.color : pick(COLORS), likesPets: Math.random()>.45, hat:pickOrNone(HATS), glasses:pickOrNone(GLASSES), toy:pickOrNone(TOYS), gait: Math.random()<.4 ? c.gait : pick(GAIT_NAMES) });
const XS = [70,210,350,490,630], GROUND = 258;
const pos = [...XS], dir = [1,1,1,1,1], mode = ['idle','idle','idle','idle','idle']; // idle | dance | walk | home
let pets, sel = 0;
try { pets = JSON.parse(localStorage.blobbies3); } catch {}
if (!Array.isArray(pets) || pets.length!==5) pets = CHARS.map((c,i)=>({...roll(c), color:c.color, gait:c.gait, xp:DEFAULT_XP[i], form:Growth.traits(DEFAULT_XP[i], c.forms).earned}));
const save = () => { try { localStorage.blobbies3 = JSON.stringify(pets); } catch {} };

// ---------- render ----------
const svg = document.getElementById('svg'), hearts = {}, hover = new Set(), evo = {}, GEOM = [], refs = [];
const NS = 'http://www.w3.org/2000/svg';

function petSVG(p, i){
  const sp = CHARS[i], t = Growth.traits(p.xp, sp.forms, p.form), f = t.form, ey = f.eyes, ex = f.eyeX, id = i;
  const hx = Math.min(20, Math.max(6, edgeX(f.d,-6)*.45));
  GEOM[i] = { legH:f.legH, hx, legW:Math.min(3.4, f.limbW*.72), armW:Math.min(3.2, f.limbW*.68), seg:f.seg, hs:Math.min(1.5, Math.max(.7, f.seg/22)), shX:Math.max(6, edgeX(f.d, f.arm)-3), shY:f.arm, f };
  const es = f.eyeSize, R = Math.min(7.8*es, ex*1.1), pr = 3.5*es, mw = ex + R*.75, my = ey + R + 8;     // eye radius, pupil radius, mouth half-width, mouth y
  const item = (kind, def) => `<g class="item" transform="${Growth.itemTransform(kind, f, def)}">${def.svg}</g>`;
  const toy = p.toy ? (T_ => `<g class="item" transform="translate(${-T_.g[0]*.8} ${-T_.g[1]*.8}) scale(.8)">${T_.svg}</g>`)(TOYS[p.toy]) : '';
  const tube = w => `fill="none" stroke="var(--ink)" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
  const leg  = c => `<g class="${c}"><path ${tube(GEOM[i].legW)}/><ellipse rx="5" ry="2.4" class="ink"/></g>`;
  const hand = () => `<g class="hd"><circle r="4.6" class="ink"/></g>`;   // just a big dot
  const eye = s => `<g class="eye"><circle cx="${s*ex}" cy="${ey}" r="${R}" fill="#fff"/><circle class="pup" cx="${s*ex}" cy="${ey}" r="${pr}" fill="var(--ink)"/><circle class="pup" cx="${s*ex+pr*.35}" cy="${ey-pr*.35}" r="${pr*.3}" fill="#fff"/></g>`;
  const stripes = f.stripes ? Array.from({length:7}, (_,k) => { const y = -6 - k*Math.max(7, f.w*.2); return `<path d="M${-f.w*1.4} ${y} Q0 ${y+f.w*.12} ${f.w*1.4} ${y}" stroke="var(--acc)" stroke-width="2.4" fill="none"/>`; }).join('') : '';
  return `<g class="pet c-${p.color} ${p.likesPets?'likes':'hates'} ${evo[i]?'evolving':''}" data-i="${i}" transform="translate(${pos[i]} ${GROUND})">
    <defs><clipPath id="cp${id}"><path d="${f.d}"/></clipPath></defs>
    <g class="grow" transform="scale(${t.scale})"><g class="pw">
      <ellipse cx="0" cy="3" rx="${Math.max(24,f.w*.9)}" ry="3" fill="#000" opacity=".07"/>
      ${leg('legL')}${leg('legR')}
      <g class="body">
        <path class="tubeL" ${tube(GEOM[i].armW)}/><path class="tubeR" ${tube(GEOM[i].armW)}/>
        <path class="fill" d="${f.d}"/>
        <g clip-path="url(#cp${id})">${stripes}${L(f.over,f)}</g>
        <g class="face">
          ${eye(-1)}${eye(1)}
          ${L(f.face,f)}
          <g transform="translate(0 ${my})">
            <g class="m-smile"><path d="M${-mw} 0 Q0 ${mw*.95} ${mw} 0" stroke="var(--ink)" stroke-width="2.8" fill="none" stroke-linecap="round"/></g>
            <g class="m-open"><path d="M${-mw} -1 Q0 ${mw*1.5} ${mw} -1Z" fill="var(--ink)"/><ellipse cx="0" cy="${mw*.55}" rx="${mw*.4}" ry="${mw*.22}" fill="var(--acc)"/></g>
            <g class="m-o"><ellipse cx="0" cy="3" rx="3" ry="4" fill="var(--ink)"/></g>
          </g>
        </g>
        ${p.glasses ? item('glasses', GLASSES[p.glasses]) : ''}
        ${p.hat ? item('hat', HATS[p.hat]) : ''}
        <g class="handL">${hand()}${toy}</g>
        <g class="handR">${hand()}</g>
      </g>
    </g></g>
    <text class="label" y="34">${f.name}</text>
    ${i===sel ? `<path class="sel-mark" d="M-6 48 L6 48 L0 41Z"/>` : ''}
  </g>`;
}
function bindRefs(){
  svg.querySelectorAll('.pet').forEach(el => { const i=+el.dataset.i, q = s => el.querySelector(s);
    refs[i] = { el, body:q('.body'), face:q('.face'), pups:[...el.querySelectorAll('.pup')], tubeL:q('.tubeL'), tubeR:q('.tubeR'), handL:q('.handL'), handR:q('.handR'), hdL:q('.handL .hd'), hdR:q('.handR .hd'),
                legLp:q('.legL path'), legLe:q('.legL ellipse'), legRp:q('.legR path'), legRe:q('.legR ellipse') }; });
}
function xpUI(){
  const p = pets[sel], t = Growth.traits(p.xp, CHARS[sel].forms, p.form);
  const nx = t.nextForm ? ` · evolves into ${t.nextForm.name} at Lv ${t.nextForm.at} (${t.nextForm.xp} xp)` : ' · final form';
  document.getElementById('xpinfo').textContent = `Lv ${t.level} · ${Math.floor(t.xp)}/${t.nextLevelXp} xp${nx}`;
  document.getElementById('xp').value = t.levelFrac;
}
function render(){
  Object.values(hearts).forEach(clearInterval);
  svg.innerHTML = pets.map(petSVG).join('');
  bindRefs(); hover.forEach(startHearts);
  CHARS.forEach((_,i) => applyPose(i, LAST[i] || restPose(i)));       // no un-posed frame after a re-render
  xpUI();
  const p = pets[sel];
  document.getElementById('name').textContent = CHARS[sel].forms[p.form].name + (p.likesPets ? ' · loves pets' : ' · hates pets');
  for (const [id,vals,cur] of [['color',COLORS,p.color],['hat',Object.keys(HATS),p.hat],['glasses',Object.keys(GLASSES),p.glasses],['toy',Object.keys(TOYS),p.toy],['gait',GAIT_NAMES,p.gait]])
    document.getElementById(id).innerHTML = (id==='color'||id==='gait' ? '' : `<option value="">no ${id}</option>`)+vals.map(v=>`<option value="${v}" ${v===cur?'selected':''}>${id==='gait'?'walk: ':''}${v}</option>`).join('');
  save();
}

// ---------- the rig: two-bone IK for legs and arms, one generic walk cycle driven by GAITS ----------
const TAU = Math.PI*2, S = Math.sin, C = Math.cos;
const LAST = [], A = CHARS.map(() => ({ ph:Math.random(), k:0, hop:0 }));
function ik(H, F, a, b, bend){                      // returns [knee/elbow, reachable end]
  let dx=F[0]-H[0], dy=F[1]-H[1]; const dist = Math.hypot(dx,dy) || 1e-6, d = Math.min(dist, a+b-.01);
  const end = [H[0]+dx*d/dist, H[1]+dy*d/dist], base = Math.atan2(dy,dx);
  const ang = base + bend*Math.acos(Math.max(-1, Math.min(1, (a*a+d*d-b*b)/(2*a*d))));
  return [[H[0]+a*C(ang), H[1]+a*S(ang)], end];
}
const footAt = (u, beta=.55) => { u = ((u%1)+1)%1; return u<beta ? [1-2*u/beta, 0] : [-1+2*(u-beta)/(1-beta), S(Math.PI*(u-beta)/(1-beta))]; };
const hop = i => { A[i].hop = .6; };

function restPose(i){ const s = GEOM[i].seg; return { by:0, lean:0, sx:1, sy:1, footL:[-GEOM[i].hx,0], footR:[GEOM[i].hx,0], handL:[-s*.3,s*1.75], handR:[s*.3,s*1.75], look:0, gaze:[0,0], happy:false }; }
function pose(i, dt, t){
  const a=A[i], p=pets[i], G=GEOM[i], m=mode[i], dr=dir[i], likes=p.likesPets, busy=!!evo[i];
  const moving = !busy && (m==='walk' || m==='home' || m==='dance');
  const g = m==='dance' ? GAITS.dance : (GAITS[p.gait] || GAITS.march);
  a.k += ((moving?1:0) - a.k) * Math.min(1, dt*8); const k = a.k;
  if (moving) a.ph += dt*g.freq;
  const ph = a.ph, hov = hover.has(i) && !busy;
  let by=0, lean=0, sx=1, sy=1;
  if (!busy) { const br = S(TAU*t/3 + i); sy += .022*br; sx -= .011*br; }              // breathing
  // legs: stance (foot slides back) then swing (foot lifts forward); stride and lift scale with leg length
  const ls = Math.min(1.8, Math.max(.6, G.legH/38)), fl = footAt(ph), fr = footAt(g.sync ? ph : ph+.5), str = g.stride*k*dr*ls;
  const footL = [-G.hx + fl[0]*str*(g.sl??1), -fl[1]*g.lift*k*ls], footR = [G.hx + fr[0]*str*(g.sr??1), -fr[1]*g.lift*k*ls];
  by += -g.bob*k*(g.sync ? fl[1] : Math.abs(S(TAU*ph))) + (g.crouch||0)*k - (g.up||0)*k + (g.dip||0)*k*Math.max(0, S(TAU*ph));
  const sq = g.squash*k*C(TAU*(g.sync ? ph : 2*ph)); sy *= 1 - sq; sx *= 1 + sq;
  lean = dr*(g.lean||0)*k + (g.roll||0)*k*S(TAU*ph);
  // being petted
  if (hov && likes) { const b = S(TAU*2.8*t); sy *= 1 + .07*b; sx *= 1 - .04*b; }
  if (hov && !likes) lean += 3*S(t*55);
  // idle hop: body leaves the ground, feet follow
  let air = 0;
  if (a.hop > 0) { const pp = 1 - a.hop/.6; air = S(Math.PI*pp); by += -26*air; sy *= 1 + .08*air; sx *= 1 - .05*air; a.hop -= dt; footL[1] += by*.7; footR[1] += by*.7; }
  // arms: hang (long, almost straight) -> out (likes pets) -> up (dance / petted / hop), plus swing against the legs
  const up = Math.max(g.armsUp ? k : 0, hov && likes ? 1 : 0, air);
  const sg = G.seg, hands = [-1,1].map(side => {
    const rest = likes && !moving ? [side*sg*.55, sg*1.55] : [side*sg*.3, sg*1.75];
    const sw = dr*(g.armSwing||0)*(sg/16)*k*S(TAU*(ph + (side<0 ? 0 : .5)));
    const hi = [side*sg*1.0, -sg*1.05 + 7*S(TAU*(moving ? 2*ph : 3*t) + side)];
    return [rest[0]*(1-up) + hi[0]*up + sw, rest[1]*(1-up) + hi[1]*up - Math.abs(sw)*.2];
  });
  // pupils drift around when idle and look where they walk
  const gaze = [dr*2.2*k + 1.5*S(t*.6 + i*2)*(1-k), 1.0*C(t*.45 + i)];
  return { by, lean, sx, sy, footL, footR, handL:hands[0], handR:hands[1], look:dr*3*k, gaze, happy: !busy && likes && (hov || m==='dance') };
}
function applyPose(i, P){
  const r = refs[i], G = GEOM[i]; if (!r) return; LAST[i] = P;
  r.body.setAttribute('transform', `translate(0 ${-G.legH+P.by}) rotate(${P.lean}) scale(${P.sx} ${P.sy})`);
  r.face.setAttribute('transform', `translate(${P.look} 0)`);
  r.pups.forEach(u => u.setAttribute('transform', `translate(${P.gaze[0].toFixed(2)} ${P.gaze[1].toFixed(2)})`));
  r.el.classList.toggle('happy', P.happy);
  const len = G.legH + 8, bendDir = dir[i]>0 ? -1 : 1;   // straight while planted, knee folds forward when the foot lifts
  for (const [side, foot, lp, le] of [[-1,P.footL,r.legLp,r.legLe],[1,P.footR,r.legRp,r.legRe]]) {
    const H = [side*G.hx, -G.legH+P.by-8], [K,F] = ik(H, foot, len/2, len/2, bendDir);
    lp.setAttribute('d', `M${H[0]} ${H[1]} L${K[0].toFixed(1)} ${K[1].toFixed(1)} L${F[0].toFixed(1)} ${F[1].toFixed(1)}`);
    le.setAttribute('cx', (F[0]+dir[i]*3).toFixed(1)); le.setAttribute('cy', F[1].toFixed(1));
  }
  for (const [side, hand, tube, hg, hd] of [[-1,P.handL,r.tubeL,r.handL,r.hdL],[1,P.handR,r.tubeR,r.handR,r.hdR]]) {
    const Sh = [side*G.shX, G.shY], Ht = [Sh[0]+hand[0], Sh[1]+hand[1]];
    const [E,End] = ik(Sh, Ht, G.seg, G.seg, -side*(hand[1] < 0 ? -1 : 1));
    tube.setAttribute('d', `M${Sh[0]} ${Sh[1]} L${E[0].toFixed(1)} ${E[1].toFixed(1)} L${End[0].toFixed(1)} ${End[1].toFixed(1)}`);
    hg.setAttribute('transform', `translate(${End[0].toFixed(1)} ${End[1].toFixed(1)})`);
    hd.setAttribute('transform', `scale(${G.hs.toFixed(2)})`);   // bigger arms, bigger dot
  }
}

// ---------- idle + pet actions ----------
const g = i => svg.querySelector(`.pet[data-i="${i}"]`);
function blink(i){ const el=g(i); if(el){ el.classList.add('blink'); setTimeout(()=>el.classList.remove('blink'),150); } setTimeout(()=>blink(i), 600+Math.random()*3500); }
CHARS.forEach((_,i)=>setTimeout(()=>blink(i), Math.random()*2000));
setInterval(()=>{ const i=rnd(5); if(!hover.has(i) && mode[i]==='idle' && !evo[i]) hop(i); }, 2500);

function startHearts(i){
  clearInterval(hearts[i]);
  if(!pets[i].likesPets) return;
  hearts[i]=setInterval(()=>{
    addXp(i,'pet');
    const t=document.createElementNS(NS,'text'); t.textContent='❤'; t.setAttribute('class','heart');
    t.setAttribute('x', pos[i]-20+Math.random()*40); t.setAttribute('y', 100+Math.random()*30);
    svg.append(t); setTimeout(()=>t.remove(),1000);
  }, 250);
}
svg.addEventListener('mouseover', e => { const el=e.target.closest('.pet'); if(!el) return; const i=+el.dataset.i; if(!hover.has(i)){ hover.add(i); startHearts(i); } });
svg.addEventListener('mouseout',  e => { const el=e.target.closest('.pet'); if(!el || el.contains(e.relatedTarget)) return; const i=+el.dataset.i; hover.delete(i); clearInterval(hearts[i]); });
svg.addEventListener('click', e => { const el=e.target.closest('.pet'); if(el){ sel=+el.dataset.i; render(); } });

// ---------- growth + evolution ----------
function float(i, text, cls, y=60){
  const t=document.createElementNS(NS,'text'); t.textContent=text; t.setAttribute('class',cls);
  t.setAttribute('x', pos[i]); t.setAttribute('y', y); svg.append(t); setTimeout(()=>t.remove(),1500);
}
function addXp(i, event, amount=1){
  const before = Growth.traits(pets[i].xp, CHARS[i].forms, pets[i].form), r = Growth.gain(pets[i].xp, event, amount);
  pets[i].xp = r.xp; const after = Growth.traits(r.xp, CHARS[i].forms, pets[i].form);
  if (r.leveledUp) float(i,'LEVEL UP!','lvl');
  // eyes/legs are quantised: re-render only when q moves a step or the level changes; otherwise just rescale
  if (r.leveledUp || Math.round(after.q*25) !== Math.round(before.q*25)) render();
  else g(i)?.querySelector('.grow')?.setAttribute('transform', `scale(${after.scale})`);
  if (i===sel) xpUI();
  checkEvolution(i);
}
function checkEvolution(i){
  const to = Growth.evolutionDue(pets[i].xp, CHARS[i].forms, pets[i].form);
  if (to >= 0 && !evo[i]) evolve(i, to);
}
// flash the old silhouette ~2s, then swap to the new form with a burst + sparkles (items re-fit by themselves)
function evolve(i, to){
  const sp = CHARS[i], from = sp.forms[pets[i].form].name;
  evo[i] = true; mode[i] = 'idle'; render();
  setTimeout(()=>{
    pets[i].form = to; delete evo[i]; render();
    g(i)?.classList.add('pop'); setTimeout(()=>g(i)?.classList.remove('pop'), 1000);
    const b=document.createElementNS(NS,'circle'); b.setAttribute('class','burst'); b.setAttribute('cx',pos[i]); b.setAttribute('cy',170); b.setAttribute('r',14);
    svg.append(b); setTimeout(()=>b.remove(),1000);
    for (let k=0;k<10;k++){
      const ang=k/10*Math.PI*2, t=document.createElementNS(NS,'text'); t.textContent='✦'; t.setAttribute('class','spark');
      t.setAttribute('x',pos[i]); t.setAttribute('y',160); t.style.setProperty('--dx',C(ang)*90+'px'); t.style.setProperty('--dy',S(ang)*90+'px');
      svg.append(t); setTimeout(()=>t.remove(),1200);
    }
    float(i, `${from} evolved into ${sp.forms[to].name}!`, 'lvl', -70);
    checkEvolution(i);                      // chained evolution if xp jumped several forms
  }, 2200);
}
setInterval(save, 3000);
document.getElementById('feed').onclick = () => { float(sel,'🍎','heart'); addXp(sel,'feed'); hop(sel); };
document.getElementById('evolve').onclick = () => {   // jump to the next form's level
  const nx = CHARS[sel].forms[pets[sel].form+1]; if (!nx || evo[sel]) return;
  pets[sel].xp = Math.max(pets[sel].xp, Math.ceil(Growth.xpForLevel(nx.at))); render(); checkEvolution(sel);
};

// ---------- main loop: pose every pet each frame, move walkers so feet don't slide ----------
const setMode = (i, m) => { if (evo[i]) return; mode[i] = (mode[i]===m ? (m==='walk' ? 'home' : 'idle') : m); };
let last = performance.now();
(function tick(now){
  const dt = Math.min((now-last)/1000, .1), t = now/1000; last = now;
  for (let i=0;i<5;i++){
    if (!GEOM[i]) continue;                 // first frame runs before the first render
    const m = mode[i];
    if (m==='dance') addXp(i,'dance',dt);
    if (m==='walk' || m==='home') {
      addXp(i,'walk',dt);
      const gt = GAITS[pets[i].gait] || GAITS.march, ls = Math.min(1.8, Math.max(.6, GEOM[i].legH/38));
      const sp = 2*gt.stride*ls*gt.freq/.55*Growth.traits(pets[i].xp, CHARS[i].forms, pets[i].form).scale;
      if (m==='walk') { pos[i] += dir[i]*sp*dt; if (pos[i]>670) { pos[i]=670; dir[i]=-1; } if (pos[i]<30) { pos[i]=30; dir[i]=1; } }
      else { const d = XS[i]-pos[i]; dir[i] = Math.sign(d)||1; if (Math.abs(d) < sp*dt) { pos[i]=XS[i]; mode[i]='idle'; } else pos[i] += dir[i]*sp*dt; }
    }
    refs[i]?.el.setAttribute('transform', `translate(${pos[i]} ${GROUND})`);
    applyPose(i, pose(i, dt, t));
  }
  requestAnimationFrame(tick);
})(last);
const act = () => render();
document.getElementById('dance').onclick    = () => { if (mode[sel]==='walk') mode[sel]='home'; setMode(sel,'dance'); act(); };
document.getElementById('run').onclick      = () => { setMode(sel,'walk'); act(); };
document.getElementById('danceAll').onclick = () => { const on = mode.some(m=>m!=='dance'); mode.forEach((_,i)=>{ mode[i]= evo[i] ? 'idle' : on?'dance':'idle'; }); act(); };
document.getElementById('runAll').onclick   = () => { mode.forEach((_,i)=>{ if(!evo[i]){ mode[i]='walk'; dir[i]= i%2? -1:1; } }); act(); };
document.getElementById('stop').onclick     = () => { mode.forEach((m,i)=>mode[i]= m==='walk' ? 'home' : 'idle'); act(); };

// ---------- ui ----------
document.getElementById('roll').onclick    = () => { pets[sel]={...roll(CHARS[sel]), xp:pets[sel].xp, form:pets[sel].form}; render(); };
document.getElementById('rollAll').onclick = () => { pets=CHARS.map((c,i)=>({...roll(c), xp:pets[i].xp, form:pets[i].form})); render(); };
for (const k of ['color','hat','glasses','toy','gait'])
  document.getElementById(k).onchange = e => { pets[sel][k]=e.target.value; render(); };
render();
</script>
</body>
